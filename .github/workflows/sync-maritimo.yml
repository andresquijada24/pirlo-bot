name: Sincronizar Marítimo

# Llama al endpoint protegido de PIRLO BOT, que trae de la API de Marítimo lo que cambió.
# Solo lee de Marítimo y escribe en la base de datos de PIRLO BOT.
# Si falta el secreto CRON_SECRET, el workflow no hace nada.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-maritimo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sincronizar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: https://pirlo-bot.vercel.app/api/cron/sync
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::Falta el secreto CRON_SECRET: sincronización desactivada."
            exit 0
          fi
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 90 "$SYNC_URL")
          echo "HTTP $code"
          cat resp.json; echo
          case "$code" in
            200) ;;
            409) echo "::warning::Otra sincronización estaba en curso." ;;
            401) echo "::error::CRON_SECRET no coincide con el de Vercel." && exit 1 ;;
            503) echo "::error::Falta CRON_SECRET en Vercel." && exit 1 ;;
            *) echo "::error::La sincronización falló (HTTP $code)." && exit 1 ;;
          esac
